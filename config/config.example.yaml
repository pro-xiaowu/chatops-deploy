mode: all

http:
  addr: ":8080"
  shutdown_timeout: 15s

database:
  # Set CHATOPS_DATABASE_URL with the database connection URL.
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m

log:
  level: info
  development: false

security:
  public_base_url: "https://chatops.example.com"
  cookie_secure: true

worker:
  id: chatops-worker
  poll_interval: 1s
  lease_ttl: 30s
  max_attempts: 3

feishu:
  api_base_url: "https://open.feishu.cn"

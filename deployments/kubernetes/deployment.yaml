apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-deploy
  namespace: chatops-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chatops-deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatops-deploy
    spec:
      serviceAccountName: chatops-deploy
      containers:
        - name: server
          image: ghcr.io/pro-xiaowu/chatops-deploy:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHATOPS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: chatops-deploy-secrets, key: database-url}
            - name: CHATOPS_SECURITY_KUBECONFIG_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: chatops-deploy-secrets, key: kubeconfig-master-key}
            - name: CHATOPS_FEISHU_APP_ID
              valueFrom:
                secretKeyRef: {name: chatops-deploy-secrets, key: feishu-app-id}
            - name: CHATOPS_FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef: {name: chatops-deploy-secrets, key: feishu-app-secret}
            - name: CHATOPS_FEISHU_VERIFICATION_TOKEN
              valueFrom:
                secretKeyRef: {name: chatops-deploy-secrets, key: feishu-verification-token}
            - name: CHATOPS_SECURITY_PUBLIC_BASE_URL
              value: https://chatops.example.com
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops-deploy
  namespace: chatops-deploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops-deploy-runtime
  namespace: chatops-deploy
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatops-deploy-runtime
  namespace: chatops-deploy
subjects:
  - kind: ServiceAccount
    name: chatops-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatops-deploy-runtime

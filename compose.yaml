services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatops
      POSTGRES_USER: chatops
      POSTGRES_PASSWORD: chatops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatops -d chatops"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHATOPS_RUNTIME_ENV: development
      CHATOPS_DEV_AUTH_ENABLED: "true"
      CHATOPS_MESSAGE_PROVIDER: web
      CHATOPS_DATABASE_URL: postgres://chatops:chatops@postgres:5432/chatops?sslmode=disable
      CHATOPS_SECURITY_KUBECONFIG_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CHATOPS_SECURITY_PUBLIC_BASE_URL: http://localhost:8080
      CHATOPS_SECURITY_COOKIE_SECURE: "false"
      CHATOPS_HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/chatops-deploy", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:

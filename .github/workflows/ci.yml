name: CI
on:
  pull_request:
  push:
    branches: [main, feature/**]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chatops_test
          POSTGRES_USER: chatops
          POSTGRES_PASSWORD: chatops
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U chatops -d chatops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CHATOPS_TEST_DATABASE_URL: postgres://chatops:chatops@127.0.0.1:5432/chatops_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: find . -name '*.go' -not -path './.tools/*' -print0 | xargs -0 gofmt -d | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test ./... -race -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with: {name: backend-coverage, path: coverage.out}
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: chatops-deploy:ci}
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: docker compose up --build -d --wait
      - run: npm --prefix web run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose down --volumes
